# The `extreme` agent preset — 极压模式（极致上下文压力模式）。
#
# 由 shipped `standard` preset 改造而来。**能力集合与 standard 完全一致**，改的只有
# 两件事：上下文预算（每步重发的量）和输出纪律（模型自己写下的字）。
# 依据《极致上下文管理插件 · 精简方案》的 S0–S6 布局；逐段映射见同目录 README.md。
#
# 与 standard 的差异，一共六处：
#   S0  persona              追加极压契约（英文、稳定前缀、可整段命中缓存）
#   S2  agent-instructions   注入预算 maxBytes 65536 → 16384
#   S3  tool-todo            单活动项，todo 列表成为唯一的覆盖式状态存储
#   S4  compaction-basic     阈值 0.8 → 0.1，保留 0.16 → 0.05，摘要 8192 → 4096 token
#   S6  tool-result-pruner   阈值 8192 → 4096 字符，头 4096 → 1024，尾 1024 → 512
#   S6  tool-fs-search       glob/grep/meta 上限收紧
#
# 其余每一行——包括两处 `disabled: true` 的 codex/claude-code 占位——都逐字保留，
# 目的就是让本文件的行集合、行顺序、realm 划分与一个已被证明可加载的组成完全相同：
# 只改 config 值，不动结构，重挂失败的面最小。
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides. `true` means an
# entry-local realm: this standing mount's own private instance.

# ── S0 identity：永久缓存段，会话内不变 ─────────────────────────────────────

# persona 是 S0。极压契约放在 prefix（section order = DEPLOYMENT_PERSONA_PREFIX，
# 整棵树最靠前），每轮逐字相同，因此是 100% 缓存命中段。
# 注意：本文件不改变工具调用协议——DSH 用原生 function calling，不套 JSON 信封；
# 契约只约束「模型自己写出来的文本」，不约束 tool_call 本身。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      You are a coding agent powered by the {{model}} model, running in EXTREME-PRESSURE context mode (极压模式). Context is a hard, small budget, not a place to accumulate history.

      Context discipline — these rules override any habit of restating work:
      - Facts only. Never quote a tool result back and never restate a file, a diff, or a command's output. Keep identifiers, numbers, paths, and verdicts; drop the prose around them.
      - English, at most 40 words. Every line you write for your own future use — a status line, a summary, a note to a later step — is English, at most 40 words, facts and IDs only, no reasoning. Longer reasoning is for this turn alone and must not be carried forward.
      - State over history. The todo list is the canonical state store: send the entire list each time so it overwrites rather than appends, keep it to at most seven items, and never re-derive progress from earlier messages.
      - Never read blind, and never read wide. Locate first (grep -n, glob, wc -l), then read the smallest window that answers the question: offset/limit, sed -n 'A,Bp'. Target at most about 60 lines or 4 KB per read. If the answer is not in that window, narrow it and read again — widening the read is the failure mode, not the fix. Before re-reading anything, ask whether a note you already wrote answers it.
      - Bound every output before it enters context. Never let a command print an unbounded amount: probe with wc -l, head -n 20, or grep -c first, then print only the slice you need (sed -n 'A,Bp', head/tail, grep -n). Cap one command's output at about 4 KB. Every byte you print stays in context verbatim for the rest of the session.
      - Batch. Independent tool calls belong in one step: one step with five reads costs far less context than five steps.
      - Stable prefix. Your instructions and the tool catalog are fixed for this session. Never ask for them to be repeated, never rewrite them, and never restate this contract in your output.

      The harness bounds you later, not now: old context is compacted into a short summary, and only as part of that compaction are over-long tool results cut to their head and tail. Until then everything you printed is still there, verbatim. When you need a pruned middle or a compacted detail, fetch exactly that range instead of asking for the whole thing.

      Deliberate trade-off of this mode: raw content older than the retained window is gone. If exact recall of everything you saw matters more than context economy, say so and the user can switch back to 标准模式.
    suffix: Your working directory is {{cwd}}.

# S2 侧：AGENTS.md 等指令文件的注入预算。65536 → 16384：
# 项目约定仍然进上下文，但不再允许一份巨型指令文件吃掉整个稳定段。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 16384

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── S6 filesystem：按需注入，且每次注入有硬上限 ────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# 极压收紧点：一次 glob/grep 能把多少结果带回上下文。
#   globMaxResults     100 → 50
#   grepMaxMatches     250 → 100
#   grepMaxLineBytes  2000 → 1000   （一行长文本不再整行进上下文）
#   searchMetaMaxBytes 65536 → 16384
# `sampleOverCapGlobResults: false` 与 standard 一致并保留：超限时报「还有更多」，
# 让模型自己收窄模式，而不是采样一份看似完整的结果。
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    globMaxResults: 50
    grepMaxMatches: 100
    grepMaxLineBytes: 1000
    searchMetaMaxBytes: 16384

# ── S6 ArtifactStore：preset 自己的一份 spill 策略（只影响本模式） ──────────

# `spill-policy` 在 `dsh-base` 里是**宿主平面**行（全局面 50000），preset 覆盖不了它。
# 但它只注册一个 `tools/post-execute` 监听器、不提供任何服务，而 `dsh-tools` 是在
# **agent 作用域**上触发这个 waterfall 的（`scopeTarget(this, exec.agent)`）——所以
# 在 preset 里再挂一份，只会对本 preset 的 agent 生效。这就是「只影响极压模式」的办法：
# 宿主那份保持 50000 不动，其他模式完全不变。
#
# 注意两点：
#   * 它不提供任何服务（只 inject 宿主 `tools`、再 `ctx.get('spillStore')`），
#     因此**不能**放进 isolate realm，否则连宿主服务都解析不到。
#   * 同一份结果会有两层，顺序由注册顺序决定（`prepend` 就是 `unshift`：宿主先注册、
#     本行后注册，所以本行在外层，先 `next()` 拿到内层结果再收口）：
#       >50KB 的结果：内层宿主先落盘一次（工件 A = 全文），本行再把那份预览收口到
#                       ≤12KB（工件 B，含 A 的 locator）——多一跳，但全文仍可达
#       12KB~50KB 的结果：宿主那层不触发，本行落盘一次，一跳
#     模型眼前的结果因此始终 ≤12KB。但要注意 pruner **不是每步都跑**：`compaction-basic`
#     只在 `compactIfNeeded()` 内部调用 `pruneSession()`，所以「只留头 1024/尾 512 字符」
#     在压缩发生之前不会发生 —— 没有压缩的会话里，12KB 以下的结果原样留到最后。
- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 12000

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is the correct
# lifetime. 文本与 standard 逐字相同：模式差异不在这里。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── S4 step log：compaction，本模式真正的「极压」所在 ───────────────────────

# 文档的 StepLog（保留 3000 步英文摘要、满则合并最旧）在 DSH 里对应
# `compaction-basic`：把旧上下文折叠成一段摘要并 shadow 掉原事件。
# 文档的目标是「窗口约 100K」——在 DSH 里由两个比例相乘得到，所以按当前路由
# 的上下文窗口反算：
#
#   thresholdRatio 0.1  × 1,000,000 ≈ 100K   触发压缩的表面 token（文档的峰值窗口）
#   retainRatio    0.05 × 1,000,000 ≈  50K   压缩后逐字保留的近期上下文
#   maxTokens 4096                           摘要本身的上限（文档的有界 step log）
#
# 换小窗口模型时这两个比例会同比缩小（128K 模型 ≈ 12.8K 触发），如需固定绝对值
# 预算，把 retainRatio 换成 retainTokens（例如 24000）并把 thresholdRatio 提到
# 0.3 以上；约束只有一条：retainTokens 必须小于该模型上的 thresholdTokens。
#
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: it stays on the HOST plane and
# owns the context-meter projection units the browser reads for every session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.1
        retainRatio: 0.05
        maxTokens: 4096
        compactionRetries: 2
        maxOverflowRetries: 2
        auto: true

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # S6 按需注入的最后一道闸：单个工具结果超过阈值就只留头尾。
    #   8192 → 4096 字符（≈1K token），头 4096 → 1024，尾 1024 → 512
    # 约束：headChars + marker + tailChars ≤ thresholdChars（1024+38+512 < 4096 ✓）。
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 4096
        headChars: 1024
        tailChars: 512

# ── delegation and workflows ────────────────────────────────────────────────

# 与 standard 完全一致：委派是极压模式的朋友而非敌人——子代理把重活带出主
# 上下文，主上下文只收一份有界报告。因此不裁剪任何委派行。
#
# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, which resolve
# that host registry.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Same disabled
    # placeholders as standard: install the Bundle and drop `disabled` to enable.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# S3 State：文档的 StateStore 是「覆盖式、固定大小、英文 key」。
# todo 列表就是 DSH 里那个结构：整表替换、有界、每步重发。
# 极压只改一点——只允许一个 in_progress，让这份状态更像状态而不是日志。
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# The `web` service and its search provider stay in the host composition.
# 注意：网页正文进上下文前不过 pruner，所以这里保留 standard 的超时，
# 由 S0 契约要求模型只带回结论。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
